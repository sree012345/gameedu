
name: game_edu
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

# ----------------------------------------
# DEPENDENCIES
# ----------------------------------------

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^9.3.0
  equatable: ^3.0.0
  flutter_bloc: ^9.1.1
  easy_localization: ^3.0.8
  internet_connection_checker_plus: ^3.1.2
  firebase_storage: ^14.0.1
  shared_preferences: ^2.5.5
  firebase_crashlytics: ^6.0.1
  cloud_firestore: ^7.1.0
  http: ^1.6.0
  firebase_auth: ^7.0.1
  firebase_messaging: ^17.0.1
  device_info_plus: ^12.4.0
  flutter_image_compress: ^2.5.1
  path: ^1.9.1
  share_plus: ^12.0.2
  windows_toast: ^0.0.3
  url_launcher: ^6.3.2
  firebase_analytics: ^13.0.1
  file_picker: 10.3.8
  croppy: ^0.0.2
  loading_indicator: ^4.0.2
  flutter_svg: ^2.3.0
  dropdown_button2: ^3.1.0
  cloud_functions: ^7.0.1
  permission_handler: 12.0.1
  firebase_core: ^5.1.0
  image_picker: ^1.2.2

# ----------------------------------------
# DEV DEPENDENCIES
# ----------------------------------------

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

# ----------------------------------------
# FLUTTER CONFIGURATION
# ----------------------------------------

flutter:
  uses-material-design: true

  # --------------------------------------
  # ASSETS
  # --------------------------------------

  assets:
    - assets/
    - assets/sounds/
    - assets/images/svg/
    - assets/images/png/

  # --------------------------------------
  # CUSTOM FONTS (OPTIONAL)
  # --------------------------------------

  # fonts:
